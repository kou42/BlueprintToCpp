name: PythonServer tests

on:
  pull_request:
    paths:
      - "PythonServer/**"
      - ".github/workflows/pythonserver-tests.yml"
  push:
    branches:
      - main
    paths:
      - "PythonServer/**"
      - ".github/workflows/pythonserver-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    defaults:
      run:
        working-directory: PythonServer
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: PythonServer/pyproject.toml
      - name: Install test dependencies
        run: python -m pip install -e ".[api,test]"
      - name: Run PythonServer tests
        run: python -m pytest -q
