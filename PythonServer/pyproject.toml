[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blueprint-to-cpp-analyzer"
version = "0.2.0"
description = "Blueprint Snapshot validator and control/data flow analyzer"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.27"]
test = ["pytest>=8", "httpx>=0.27,<0.29", "httpx2>=2.0.0"]

[project.scripts]
blueprint-to-cpp-verify = "app.ubt_verification:main"
blueprint-semantic-editor-e2e = "app.semantic_editor_e2e:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
